# Streamlit configuration for the FGNMHS grading system.
#
# The theme lives here rather than in per-page CSS so it applies to every
# page at once and needs no rework as pages are added. Only keys this
# Streamlit version actually supports are set — an unknown key logs a
# warning on every start.

[theme]
# DepEd blue, matching the school seal. The same value is used by the
# award certificates and term cards (`_BLUE` in app/certificate_generator.py
# and app/term_card.py), so screen and print agree.
primaryColor = "#1B4F9C"

base = "light"
backgroundColor = "#FFFFFF"
# Sidebar, table headers and other inset surfaces. A faint blue-grey
# rather than plain grey, so it reads as part of the same palette.
secondaryBackgroundColor = "#F1F4F9"
textColor = "#1C1F26"
linkColor = "#1B4F9C"

# Softer than Streamlit's default divider, which is heavy against the
# many tables this app renders.
borderColor = "#DDE3EC"
showWidgetBorder = true
baseRadius = "medium"

# Rethink Sans for headings, DM Sans for body text. Both are declared
# below as web fonts so every teacher sees them regardless of what is
# installed locally; the fallbacks keep the app readable if the font CDN
# is ever unreachable.
font = "DM Sans, sans-serif"
headingFont = "Rethink Sans, sans-serif"

# Variable fonts, so one file covers the weight range — the same URL is
# declared per weight because that is the form Streamlit expects. These
# are the "latin" subsets, which include the accented characters that
# appear in learner names.
[[theme.fontFaces]]
family = "DM Sans"
url = "https://fonts.gstatic.com/s/dmsans/v17/rP2Yp2ywxg089UriI5-g4vlH9VoD8Cmcqbu0-K4.woff2"
weight = 400

[[theme.fontFaces]]
family = "DM Sans"
url = "https://fonts.gstatic.com/s/dmsans/v17/rP2Yp2ywxg089UriI5-g4vlH9VoD8Cmcqbu0-K4.woff2"
weight = 500

[[theme.fontFaces]]
family = "DM Sans"
url = "https://fonts.gstatic.com/s/dmsans/v17/rP2Yp2ywxg089UriI5-g4vlH9VoD8Cmcqbu0-K4.woff2"
weight = 700

[[theme.fontFaces]]
family = "Rethink Sans"
url = "https://fonts.gstatic.com/s/rethinksans/v7/AMOWz4SDuXOMCPfdoglY9JQEVFi3.woff2"
weight = 400

[[theme.fontFaces]]
family = "Rethink Sans"
url = "https://fonts.gstatic.com/s/rethinksans/v7/AMOWz4SDuXOMCPfdoglY9JQEVFi3.woff2"
weight = 700

[[theme.fontFaces]]
family = "Rethink Sans"
url = "https://fonts.gstatic.com/s/rethinksans/v7/AMOWz4SDuXOMCPfdoglY9JQEVFi3.woff2"
weight = 800

[theme.sidebar]
# The navigation carries the school's colour; the content area stays
# white so grade tables and report previews are read on a neutral field.
backgroundColor = "#F1F4F9"
primaryColor = "#1B4F9C"
borderColor = "#DDE3EC"

[server]
# Streamlit's uploader default is 200MB. Nothing here is bigger than a
# CSV masterlist or an Excel template, and a smaller cap limits what a
# mistaken upload can cost.
maxUploadSize = 25

# Off because the watcher re-imports local modules it thinks have
# changed, and re-executing a model module re-registers its table on the
# same MetaData — which fails outright with "Table is already defined for
# this MetaData instance" and takes the whole app down. On a deployed
# host the files never change while running, so the watcher only carries
# that risk. Locally it means restarting Streamlit after editing a module
# rather than relying on hot reload; the script itself still re-runs on
# every interaction as normal.
fileWatcherType = "none"

[browser]
# Usage stats are off by default in recent versions; stated explicitly
# because this app handles learner records.
gatherUsageStats = false
